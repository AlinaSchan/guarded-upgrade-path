# Builds Windows (NSIS + MSI) and macOS (app + dmg, Apple silicon and Intel)
# installers and attaches them to ONE draft GitHub release. The `draft` job
# creates that draft up front, so the three parallel builds never race to
# create it (tauri-action did that once and produced two drafts for one tag).
# The draft is published by hand once the assets have been checked. Linux
# installers are intentionally not built: the application runs on Windows and
# macOS only.

name: Release (draft)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Create the draft release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release for the tag (reuse it if it already exists)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          find_draft() {
            gh api "repos/${{ github.repository }}/releases?per_page=50" \
              --jq ".[] | select(.tag_name == \"$tag\" and .draft) | .id" | head -n 1
          }
          id=$(find_draft)
          if [ -z "$id" ]; then
            gh release create "$tag" --draft --title "Guarded Upgrade Path ${tag#v}" --notes-file .github/release-notes.md
            id=$(find_draft)
          fi
          test -n "$id"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "draft release id: $id"

  build:
    name: Build ${{ matrix.label }}
    needs: [draft]
    # On a tag push the draft must exist; on a manual run the draft job is skipped and nothing is uploaded.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple silicon)
            args: "--target aarch64-apple-darwin"
            cli: target/aarch64-apple-darwin/release/gup-verify
            cli_name: gup-verify-macos-aarch64
          - platform: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
            cli: target/x86_64-apple-darwin/release/gup-verify
            cli_name: gup-verify-macos-x86_64
          - platform: windows-latest
            label: Windows (x64)
            args: ""
            cli: target/release/gup-verify.exe
            cli_name: gup-verify-windows-x64.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Build desktop bundles and attach them to the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}
      - name: Build verifier CLI
        run: cargo build --release -p gup-verify ${{ matrix.args }}
      - name: Attach verifier CLI to the draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ matrix.cli }}" "${{ matrix.cli_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.cli_name }}" --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: bundles-${{ matrix.cli_name }}
          if-no-files-found: warn
          path: |
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            ${{ matrix.cli }}

  tidy:
    name: Tidy the draft release
    needs: [draft, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Drop the .app.tar.gz archives (the .dmg files are the macOS downloads) and list the assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rel="repos/${{ github.repository }}/releases/${{ needs.draft.outputs.release_id }}"
          for id in $(gh api "$rel/assets" --jq '.[] | select(.name | endswith(".app.tar.gz")) | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
          done
          echo "assets on the draft release:"
          gh api "$rel/assets" --jq '.[] | "  \(.name)\t\(.size)"'
