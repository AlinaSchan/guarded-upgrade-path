# Builds Windows (NSIS + MSI) and macOS (app + dmg, Apple silicon and Intel)
# installers and attaches them to a DRAFT GitHub release. The draft is
# published by hand once the assets have been checked. Linux installers are
# intentionally not built: the application runs on Windows and macOS only.

name: Release (draft)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (Apple silicon)
            args: "--target aarch64-apple-darwin"
            cli: target/aarch64-apple-darwin/release/gup-verify
            cli_name: gup-verify-macos-aarch64
          - platform: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
            cli: target/x86_64-apple-darwin/release/gup-verify
            cli_name: gup-verify-macos-x86_64
          - platform: windows-latest
            label: Windows (x64)
            args: ""
            cli: target/release/gup-verify.exe
            cli_name: gup-verify-windows-x64.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Build desktop bundles and create/update the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: "Guarded Upgrade Path ${{ github.ref_name }}"
          releaseBody: |
            Review aid for the Guarded Upgrade Path review draft (October 2026), published by Logos (https://logos.co/).
            Runs offline on a deterministic local model. Not production software; no external review has been completed.

            **Windows 10/11 (x64):** download the `*_x64-setup.exe` installer (installs per user, no administrator rights) or the `*_x64_en-US.msi`. The installer is unsigned, so SmartScreen may show "Windows protected your PC" once: *More info → Run anyway*.

            **macOS:** download `*_aarch64.dmg` for Apple silicon (M1 or later) or `*_x64.dmg` for Intel, and drag the app to Applications. The app is unsigned and not notarized, so the first launch is blocked by Gatekeeper: either *System Settings → Privacy & Security → Open Anyway* after the first attempt, or clear the quarantine flag once with `xattr -dr com.apple.quarantine "/Applications/Guarded Upgrade Path.app"`.

            **Linux and web browsers are not supported.** There is no Linux build; on any platform other than Windows or macOS the application refuses to start with an error.

            The `gup-verify` CLI is attached separately for out-of-process verification of an exported bundle.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      - name: Build verifier CLI
        run: cargo build --release -p gup-verify ${{ matrix.args }}
      - name: Attach verifier CLI to the draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ matrix.cli }}" "${{ matrix.cli_name }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.cli_name }}" --clobber
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: bundles-${{ matrix.cli_name }}
          if-no-files-found: warn
          path: |
            target/**/release/bundle/**/*.exe
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            ${{ matrix.cli }}
