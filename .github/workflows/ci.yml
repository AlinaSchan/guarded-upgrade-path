name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (domain engine + verifier CLI)
    strategy:
      fail-fast: false
      matrix:
        # macOS is covered by the release workflow (tag builds) and the on-demand package job.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p gup-domain -p gup-verify --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p gup-domain -p gup-verify
      - name: Desktop app refuses to start on Linux
        # The application is distributed for Windows and macOS only; on Linux the
        # binary must exit with an error instead of starting.
        if: runner.os == 'Linux'
        run: |
          set +e
          out=$(cargo run -q -p guarded-upgrade-path 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" -ne 0
          printf '%s\n' "$out" | grep -q "Windows and macOS only"

  frontend:
    name: Frontend (type-check, bundle, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  package:
    # Packaging smoke build for the two published platforms, run on demand (Actions > CI > Run workflow).
    # Linux installers are not built or published.
    name: Package (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch'
    needs: [rust, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Build desktop bundles (not published)
        run: npm run tauri -- build --ci ${{ matrix.args }}
      - name: Build verifier CLI
        run: cargo build --release -p gup-verify ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app/**
            target/**/release/gup-verify
            target/**/release/gup-verify.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/gup-verify.exe
