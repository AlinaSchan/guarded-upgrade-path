[package]
name = "guarded-upgrade-path"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
description = "Guarded Upgrade Path — interactive technical review sandbox (desktop app)"
default-run = "guarded-upgrade-path"

[[bin]]
name = "guarded-upgrade-path"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# The desktop shell is distributed for Windows and macOS only. On every other
# target the binary is a stub that refuses to start (src/unsupported.rs), so the
# engine, Tauri and its platform libraries are compiled only for those two.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
gup-domain = { path = "../crates/gup-domain" }
serde.workspace = true
serde_json.workspace = true
